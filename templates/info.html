<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣活動資訊網</title>

    <link href="../assets/css/plugins/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/fonts/font-awesome.min.css" rel="stylesheet">
    <link href="../assets/fonts/bs-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/plugins/slick.css" rel="stylesheet">
    <link href="../assets/css/plugins/nice-select.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/responsive.css" rel="stylesheet">

    <style>
        /* ... 保留原本的 CSS ... */
        :root { --thm-color-one: #FF6600; }
        .thm-color-one { color: #FF6600; }
        .thm-btn { background-color: #FF6600; color: #fff; border: none; }
        .thm-btn:hover, .thm-btn:focus { background-color: #e65c00; color: #fff; }
        /* ... (略過中間未變動的樣式) ... */
        
        input[type="button"] {
            background-color: var(--thm-color-one);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin: 0.25rem;
        }
        input[type="button"]:hover { background-color: #e65c00; }

        /* === 新增：備註輸入框樣式 === */
        .memo-container {
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
        }
        .memo-textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        .memo-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }

        /* === 新增：全螢幕轉圈圈動畫 === */
        #loadingOverlay {
            display: none; /* 預設隱藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FF6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">AI 正在為您規劃行程中...<br>請稍候，這可能需要幾秒鐘</div>
    </div>

    <header class="header can-sticky">
       <div class="container">
            <div class="header_inner">
                <div class="logo">
                    <a href="{{ url_for('home')}}" class="d-flex h-100">
                        <img src="../assets/images/logo_copy.png" alt="logo" class="image-fit-contain">
                    </a>
                </div>
                 </div>
        </div>
    </header>

    <div class="single_banner section-bg"
        style="background-image: url(https://static.wixstatic.com/media/85545b_a3276036a6ce48cfb1ca30ac935f6cdd~mv2.jpg/v1/fill/w_3958,h_2354,al_c,q_90/85545b_a3276036a6ce48cfb1ca30ac935f6cdd~mv2.webp); background-position: center;">
        <div class="relative text-center">
            <div class="container">
                <div class="banner_text">
                    <h1 class="title" style="color: white;"> {{ event.資料名稱 }} <span class="fw-bold"
                            style="color: #FFD700;">活動資料</span> </h1>
                </div>
            </div>
        </div>
        <span class="left_skew"></span>
        <span class="right_skew"></span>
    </div>

    <div class="container" style="padding: 2%;">
        <table class="table">
            {% for key, value in event.items() %}
            <tr>
                <th>{{ key }}</th>
                {% if value %}
                <td>{{ value }}</td>
                {% else %}
                <td><em>無資料</em></td>
                {% endif %}
            </tr>
            {% endfor %}
        </table>

        <div class="memo-container">
            <label for="userMemo" class="memo-label">行程需求備註 (選填)：</label>
            <textarea id="userMemo" class="memo-textarea" placeholder="例如：我們有帶一位3歲小孩、希望行程輕鬆一點..."></textarea>
        </div>

        <div style="text-align:center;">
            <input type="button" onclick="history.back()" value="回到上一頁"></input>
            <input type="button" value="一日遊" onclick="generateTrip('one-day', '{{event.唯一識別碼}}')">
            <input type="button" value="二日遊" onclick="generateTrip('two-day', '{{event.唯一識別碼}}')">
            <input type="button" value="三日遊" onclick="generateTrip('three-day', '{{event.唯一識別碼}}')">
        </div>
    </div>

    <footer class="footer section-padding section-bg" style="background-image: url(../assets/images/bg/footer.jpg);">
        <div class="container">
            <div class="row">
                <div class="col-lg-4 col-sm-6">
                    <div class="ft_widgets">
                        <div class="ft_about">
                            <div class="ft_logo">
                                <img src="../assets/images/logo_two.png" alt="logo" class="image-fit-contain">
                            </div>
                            <p>分享您在台灣的美好活動時刻。在社群媒體上追蹤我們，並標註 #活動瘋台灣</p>
                        </div>
                    </div>
                </div>
                </div>
        </div>
    </footer>
    
    <div class="thm-bg-color-one">
         <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <div class="copyright">
                        <p class="mb-0 text-white">Copyright © <span id="year">2025</span>. 台灣活動資訊網. All Right Reserved.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/plugins/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/plugins/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/plugins/slick.min.js"></script>
    <script src="../assets/js/plugins/jquery.nice-select.js"></script>
    <script src="../assets/js/custom.js"></script>
    
    <script>
        function goSearch() {
            const kw = document.getElementById('search-input').value.trim();
            if (!kw) return;
            window.location.href = `/search/${encodeURIComponent(kw)}`;
        }
        function goSearchMobile() {
            const kw = document.getElementById('search-input-mobile').value.trim();
            if (!kw) return;
            window.location.href = `/search/${encodeURIComponent(kw)}`;
        }

        function generateTrip(days, eventId) {
            // 1. 取得使用者輸入的備註
            const memo = document.getElementById('userMemo').value.trim();
            
            // 2. 顯示 Loading 動畫
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // 3. 組合 URL (將 memo 作為 GET 參數傳遞)
            let url = `/trip/${days}/${eventId}`;
            if (memo) {
                // 使用 encodeURIComponent 確保中文或特殊符號正確傳遞
                url += `?memo=${encodeURIComponent(memo)}`;
            }
            
            // 4. 進行跳轉
            window.location.href = url;
        }
    </script>
</body>

</html>
